# power_scenarios.yaml — 权力变化的两种模型(footprint 与 stakeholder 标签永远不变,只动高度)
# ============================================================================
# 模式 _mode(预设 conserve):
#
#  conserve(总量守恒、重分配)——**总 GFA 不变**。既有总建筑量 = 政府与私人早已协商沉淀
#    的「固定信封」;权力转向不凭空增减总量,只**重分配谁占有它**:某方多拿、某方少拿,加总守恒。
#    每方 mult = 其「吸引力权重」:>1 = 多分一点(资本家 1.6 即多拿)、<1 = 让出一点。
#    引擎自动正规化使 Σ新GFA = Σ旧GFA。→ step4 的「总 GFA ×baseline」会是 ×1.00,
#    差异全在「谁的楼长高、谁的略矮」(看各 stakeholder 平均高与 3D 天际线的此消彼长)。
#
#  grow(只增、都更新增)——既有为地板,**只增不减**(垂直加密/都更),总 GFA 上升。
#    mult≥1 在既有上加盖(mult<1 视为不增,不准缩既有)。代表「新一轮开发确实新增量」。
#
# 改这张表 = 反事实:调权重、加情景、切 _mode,不必碰程式。
scenarios:
  current:                 # 基线:conserve 全权重 1 → 完全不变
    _mode: conserve

  # 1. 开发商主导：
  # 商业、办公、零售和酒店获得较高的发展权；
  # 居住、公共设施保持基本稳定。
  # 形态预期：商业节点更突出，形成局部高层集聚。
  developer_led:
    _mode: grow
    developer: {mult: 2.20, cap_m: 220}
    resident:  {mult: 0.95, cap_m: 100}
    state:     {mult: 1.00, cap_m: 130}
    informal:  {mult: 0.70, cap_m: 35}
    unknown:   {mult: 0.85, cap_m: 75}

  # 2. 社区主导：
  # 五角场「知识公共性与社区生活优先」情景。
  # 高校、医院、学校、公共服务和居民住区获得适度增高；
  # 商业开发保持但不再无限扩张。
  # 形态预期：形成较连续的公共-社区型天际线。
  community_led:
    _mode: grow
    state:     {mult: 2.00, cap_m: 160}
    resident:  {mult: 1.55, cap_m: 120}
    developer: {mult: 0.85, cap_m: 110}
    informal:  {mult: 0.65, cap_m: 30}
    unknown:   {mult: 0.85, cap_m: 70}

  # 3. 公共生态主导：
  # 公共设施、教育、医疗与公共服务空间成为主要节点；
  # 居住空间基本稳定，商业高度增长受约束。
  # 形态预期：公共建筑呈现分散而清晰的高度特征。
  state_eco:
    _mode: grow
    state:     {mult: 2.30, cap_m: 180}
    resident:  {mult: 1.15, cap_m: 100}
    developer: {mult: 0.75, cap_m: 100}
    informal:  {mult: 0.65, cap_m: 30}
    unknown:   {mult: 0.80, cap_m: 65}

  # 4. 开发更新：
  # 商业更新与居住更新同步发生；
  # 商业楼形成高点节点，居住区也获得一定更新容量。
  # 形态预期：商业中心更集中，整体密度适度上升。
  developer_renewal:
    _mode: grow
    developer: {mult: 2.50, cap_m: 240}
    resident:  {mult: 1.45, cap_m: 130}
    state:     {mult: 1.10, cap_m: 140}
    informal:  {mult: 0.75, cap_m: 40}
    unknown:   {mult: 1.05, cap_m: 90}

  # 5. 最大变化测试：
  # 用于制造最明显的对比，但仍控制在五角场可讨论尺度内。
  # 居住、商业与公共设施均获得较高发展权。
  # 适合作为「高密度复合开发」的实验情景。
  max_change:
    _mode: grow
    resident:  {mult: 2.20, cap_m: 170}
    developer: {mult: 3.00, cap_m: 260}
    state:     {mult: 1.80, cap_m: 180}
    informal:  {mult: 1.00, cap_m: 50}
    unknown:   {mult: 1.35, cap_m: 110}
