<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Shanghai locator basemap</title>
<link href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #fafaf8; }
  #map { width: 1024px; height: 1084px; }
  .maplibregl-control-container { display: none; }
</style>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/positron',
    center: [121.52, 31.27], zoom: 8,
    interactive: false,
    pixelRatio: 1,
    preserveDrawingBuffer: true,
  });
  map.on('style.load', () => {
    for (const layer of map.getStyle().layers) {
      if (layer.type === 'symbol') map.setLayoutProperty(layer.id, 'visibility', 'none');
    }
    map.fitBounds([[120.95, 30.65], [122.09, 31.90]], {padding: 0, duration: 0});
  });
  map.on('idle', () => {
    document.body.dataset.ready = 'yes';
    const b = map.getBounds();
    document.body.dataset.bounds = JSON.stringify([b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]);
  });
</script>
</html>
