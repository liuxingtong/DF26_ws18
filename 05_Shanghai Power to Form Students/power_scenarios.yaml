# power_scenarios.yaml — 权力变化两种模型(footprint 与 stakeholder 标签永远不变,只动高度)
# ============================================================================
# _mode(默认 conserve):
#  conserve(总量守恒、重分配)——总 GFA 不变,权力只重分配既有总量(某方多拿、某方少拿,加总守恒)。
#    每方 mult = 吸引力权重:>1 多拿、<1 让出;引擎正规化使 Σ新GFA = Σ旧GFA。→ step4「总GFA×基线」=×1.00。
#  grow(只增、都更新增)——既有为地板,只增不减,总 GFA 上升。
# informal 在上海无信号、栋数为 0,其 mult 写了也不起作用(留作占位)。
scenarios:
  current:
    _mode: conserve

  developer_led:           # 开发商主导:资本多拿,其余让出(守恒)
    _mode: conserve
    developer: {mult: 1.6}
    resident:  {mult: 0.90}
    state:     {mult: 0.95}
    informal:  {mult: 0.85}
    unknown:   {mult: 0.95}

  community_led:           # 社区主导:居民多拿,资本让出(守恒)
    _mode: conserve
    developer: {mult: 0.70}
    resident:  {mult: 1.30}
    state:     {mult: 1.10}
    informal:  {mult: 1.20}
    unknown:   {mult: 1.00}

  state_eco:               # 国家生态:公共多拿、资本让出(守恒)
    _mode: conserve
    developer: {mult: 0.70}
    resident:  {mult: 0.95}
    state:     {mult: 1.60}
    informal:  {mult: 1.00}
    unknown:   {mult: 0.95}

  developer_renewal:       # (grow 对照)都更新增:资本与居民实际加盖,总 GFA 上升
    _mode: grow
    developer: {mult: 1.5}
    resident:  {mult: 1.15}
    state:     {mult: 1.0}
    informal:  {mult: 1.0}
    unknown:   {mult: 1.2}

  tourism_capture:          # 打浦桥:旅游流量资本主导,文旅商业多拿高度/容量
    _mode: conserve
    developer: {mult: 1.35, cap_m: 36}
    resident:  {mult: 0.88}
    state:     {mult: 0.95}
    informal:  {mult: 1.00}
    unknown:   {mult: 0.95}

  everyday_life_first:      # 打浦桥:居民安全与日常生活优先,资本让出
    _mode: conserve
    developer: {mult: 0.72, cap_m: 24}
    resident:  {mult: 1.25}
    state:     {mult: 1.15}
    informal:  {mult: 1.00}
    unknown:   {mult: 1.00}

  heritage_micro_economy:   # 打浦桥:遗产、小商户、创意工作室共生,中低层细粒度
    _mode: conserve
    developer: {mult: 0.88, cap_m: 30}
    resident:  {mult: 1.12}
    state:     {mult: 1.10}
    informal:  {mult: 1.00}
    unknown:   {mult: 1.00}

  negotiated_24h_alley:     # 打浦桥:24小时协商弄堂,居民/安全/文化与商业相对均衡
    _mode: conserve
    developer: {mult: 1.02, cap_m: 30}
    resident:  {mult: 1.08}
    state:     {mult: 1.12}
    informal:  {mult: 1.00}
    unknown:   {mult: 1.00}
