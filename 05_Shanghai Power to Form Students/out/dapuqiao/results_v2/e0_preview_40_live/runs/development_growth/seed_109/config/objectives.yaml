objectives:
  residential_disruption:
    direction: minimize
    label: 居住影响暴露
    unit: ratio
    definition: 被直接修改，或与增高、拆分、退台建筑位于同一道路围合更新单元的住宅现状 GFA / 住宅总 GFA；采用离散暴露判定，不使用距离权重
  development_capacity:
    direction: maximize
    label: 净建筑面积变化
    unit: floor_area_ratio_delta
    definition: (Σ 方案 GFA − Σ 现状 GFA) / 研究区面积；增建与拆减相互抵消，方案不能靠"先拆后补"抬高该值；增建总量与拆减总量另列 gross_added_m2、gross_removed_m2
    reported_components: [gross_added_m2, gross_removed_m2]
    note: 键名沿用 development_capacity，以保持既有运行存档、比较脚本与三维平台的字段兼容；语义是净变化，不是"只计增建"。
  street_connected_released_ground:
    direction: maximize
    label: 街道连接的释放地面潜力
    unit: street_buffer_ratio
    definition: 现状占地减去方案占地后与 5 m 道路缓冲相交的面积 / 研究区内该缓冲的总面积；只读取建筑足迹与街道网络，不读取公共空间背景图层，也不表示公共空间面积、权属或可达性
    denominator: street_buffer_area_m2

measurement:
  # 三个当前情景共同使用；不得由情景配置覆盖。
  street_access_buffer_m: 5.0

data_dependencies:
  street_connected_released_ground:
    required_layers:
      - buildings.parquet
      - street_network.geojson
      - study_boundary.geojson
    excluded_context_layers:
      - public_space_candidates.geojson
      - public_space_verification.json
      - alley_entrances.geojson
      - alley_entrance_verification.json
    note: 第三目标仅计算形态释放地面与道路缓冲的相交面积；公共空间身份、历史面积、OSM 研究多边形、入口点、开放性和权属均不进入目标。

numerical_resolution:
  # 经用户确认的研究假设，用来滤除浮点噪声和不可读的微小变化。
  minimum_building_gfa_change_m2: 1.0
  minimum_building_footprint_change_m2: 1.0
  minimum_building_height_change_m: 0.1

epsilon:
  # f2 改为净变化后仍以 0.0005 为"同一档"容差（约合研究区 790 m²）；
  # f3 换用缓冲面积分母后，按同一相对分辨率为 0.00005 × 6.37 ≈ 0.0003。
  residential_disruption: 0.001
  development_capacity: 0.0005
  street_connected_released_ground: 0.0003

normalization_reference:
  # 2026-10-28 随 f2（净变化）与 f3（缓冲分母）口径调整重新校准。
  # f2 为有符号量：下界按"最多缩地"取负，上界按"最多增高"取正；超出仍截到 0/1。
  # f3 上界 = 0.0025（研究区口径）÷ 0.157（缓冲占研究区比例）≈ 0.016。
  residential_disruption: {minimum: 0.0, maximum: 0.35}
  development_capacity: {minimum: -0.03, maximum: 0.03}
  street_connected_released_ground: {minimum: 0.0, maximum: 0.016}

representative_sampling:
  maximum_solutions: 9
