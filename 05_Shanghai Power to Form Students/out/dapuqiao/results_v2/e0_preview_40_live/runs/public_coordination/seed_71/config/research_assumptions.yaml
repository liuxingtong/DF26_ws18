profile:
  id: dapuqiao_v1
  label: 打浦桥研究假设 v1
  status: research_assumption
  statutory_planning_result: false
  frozen_on: 2026-09-18

spatial_inputs:
  study_boundary:
    rule: 使用仓库中的打浦桥 OSM 研究边界
    evidence_class: reproducible_open_data
  intervention_zones:
    rule: 使用道路缓冲带切分形成的 38 个道路围合单元
    evidence_class: derived_research_assumption
  unmatched_buildings:
    count_at_freeze: 32
    rule: 保留在现状模型中，但设为不可编辑背景，不强行并入最近单元
    evidence_class: conservative_research_assumption

heritage_constraints:
  name: 黄浦区第二批文物保护点建筑级冻结匹配
  official_records_in_scope: 16
  records_with_frozen_building_match: 12
  protected_building_footprints: 21
  unresolved_records_excluded: [HP-74, HP-75, HP-83, HP-88]
  rule: heritage_buildings.geojson 中的建筑不可拆除、移动、缩小首层或增高
  evidence_class: official_record_plus_reviewed_geocoded_building_match
  limitation: 建筑轮廓是论文实验的冻结研究匹配，不是法律意义上的保护边界；4 条范围未决记录不进入优化

planning_controls:
  baseline_rule: 现状高度、容积率和覆盖率是每个单元控制值的下限，避免把现有合法形态误判为违规
  provisional_defaults:
    height_limit_m: 36.0
    max_far: 3.0
    max_coverage_ratio: 0.60
    minimum_residential_retention: 0.80
  evidence_class: provisional_common_sense_assumption
  limitation: 暂未获得覆盖全部 38 个研究单元的逐地块法定控规指标，以上数值只用于方法实验和敏感性分析
  official_adjustment_reference:
    public_open_space_floor_area_increase_ratio: 0.15
    height_increase_at_or_below_50m_m: 5.0
    height_increase_above_50m_ratio: 0.10
    height_increase_above_50m_cap_m: 10.0
    use: 仅作为敏感性分析边界的参考，不直接宣称为所有地块的建设权

objective_measurement:
  source: optimization/objectives.yaml
  street_access_buffer_m: 5.0
  rule: 四情景与传统参数基线固定使用同一目标测量口径，不随治理情景变化
  epsilon: {residential_disruption: 0.001, development_capacity: 0.0005, street_connected_released_ground: 0.00005}
  status: confirmed_research_assumption

