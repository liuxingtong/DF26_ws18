limitations:
- OpenStreetMap completeness and tags vary by feature and date.
- Only two public-space candidates were mapped in this OSM snapshot; coverage is incomplete
  and neither is used by the optimization objective.
- The OSM boundary area is about 0.86% smaller than the legacy local boundary used
  by site.yaml.
- Liyuan Park is verified as a context-level public park through AMap and government
  sources; the current OSM polygon is research geometry, not a surveyed or legal boundary.
- The latest official schedule located is the historical 2021 listing (05:00-21:00);
  current whole-park hours remain unverified.
- Baiyulan Square remains an unverified and excluded OSM candidate; its public access
  and ownership are not established.
- These files are not official planning, cadastral, or heritage records.
- The alley layer is non-exhaustive: gate 1 has an official narrative cross-check,
  while gate 2 is an OSM-only frozen candidate; neither enters optimization.
