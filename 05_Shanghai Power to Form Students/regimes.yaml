# regimes.yaml —— 进阶册:权力体制 = 原子算子(engine/operators.py)的配方
# ============================================================================
# 主册「只调高度」只放开一个自由度(高度);进阶册放开**形态语法**:权力改的是城市怎么长。
# 每个体制 = 一串算子(按序施加)。改这里 = 改「这种权力如何重写城市」,不必碰程式。
# 想自己加/换算子:见「算子替换指南.md」(复制粘贴即可)。
#
# 算子清单(见 engine/operators.py / 进阶 notebook 的算子图谱):
#   freeze(who)                          锁定某些 stakeholder 不动(state/遗产)
#   weight_height(weights, mode)         按 stakeholder 权重重分配高度(conserve 守恒 / grow)
#   concentrate(center,reach_frac,...)   高度向权力重心按距离收拢(守恒,单峰)
#   split_to_towers(target,above_m2,k)   大 footprint 沿长轴拆成 k 块塔(GFA 守恒)
#   slim(target,ratio)                   footprint 缩、高度补偿(塔化,单栋 GFA 守恒)
#   densify(target,far_gain,cap_m)       抬高度 = 加 GFA(加密)
#   infill(target,cell_m2,min_h,max_h,vary)  大体量细分成自建小单元(细粒低层)
#   level(target,toward,alpha)           高度趋同(toward: median/p40/数值;alpha 强度)
#   open_ground(target,ratio,cap_m)      缩私有 footprint 释放共享地面、高度补偿(守恒)
#   scale_graded(target,center,factor,reach_frac,min_factor)  footprint 依到中心点距离渐变缩放(高度不变)
#
# 这些 regime→形态 是**教学假设/可争论的语言**,不是经验断言或真实规划预测。零 AI 推断。

developer_led:
  label: 开发商主导
  desc: 资本介入住宅/商业用地:拆板成塔 → 塔化变细 → 加密(多中心、GFA↑、覆盖↓)。先把 state 放大 2 倍再锁定。
  feature: 细高塔(瘦长比明显升高)
  steps:
    - { op: scale, target: [state], factor: 2.0 } # state 依几何中心放大 2 倍。**必须在 freeze 之前**,否则被冻结跳过
    - { op: freeze, who: [state] }
    - {
        op: split_to_towers,
        target: [resident, developer],
        above_m2: 1500,
        k: 3,
      }
    - { op: slim, target: [resident, developer], ratio: 0.45 }
    - { op: densify, target: [resident, developer], far_gain: 1.8, cap_m: 480 }

state_led:
  label: 政府主导 / 中央集权
  desc: 政府多拿 + 高度向权力重心(政府/公共质心)收拢(单中心一座尖峰、GFA 守恒、高度CV↑)。
  feature: 向权力重心收拢的高峰(重心集中度普遍翻倍)
  steps:
    - {
        op: weight_height,
        weights: { state: 1.8, developer: 0.8, resident: 0.85, unknown: 0.9 },
        mode: conserve,
      }
    - {
        op: concentrate,
        center: state_centroid,
        reach_frac: 0.18,
        state_boost: 2.0,
        cap_m: 600,
      }

resident_self_build:
  label: 居民自建为主
  desc: 居民把大体量细分为自建小单元(细粒、高覆盖、低层、有机),高度趋低。state 公共不动。
  feature: 细粒碎化(栋数大增、高度趋低)
  steps:
    - { op: freeze, who: [state] }
    - {
        op: infill,
        target: [resident, developer],
        cell_m2: 120,
        min_h: 6,
        max_h: 21,
        vary: 0.35,
      }
    - { op: level, target: [resident, developer], toward: p40, alpha: 0.6 }

developer_scale_graded:
  label: 开发商渐变放大
  desc: 开发商用地依「到建筑中心点的距离」渐变放大 footprint(近中心最多 2 倍、向外衰减到 1 倍;高度不变、GFA↑不守恒)。
  feature: 中心膨胀(近中心 footprint 显著变大、覆盖↑)
  steps:
    - {
        op: scale_graded,
        target: [developer],
        center: global_centroid,
        factor: 2.0,
        reach_frac: 0.25,
        min_factor: 1.0,
      }

shared:
  label: 共享 / 公共平权
  desc: 缩私有 footprint 释放共享地面 + 高度趋同(均质中高、低覆盖、大量共享地、无人独大)。
  feature: 均质开放(高度CV 最低)
  steps:
    - { op: open_ground, target: [resident, developer], ratio: 0.6, cap_m: 200 }
    - {
        op: level,
        target: [resident, developer, state],
        toward: median,
        alpha: 0.7,
      }

# ---- 曹杨新村 / 工人新村情境(自定义算子 linear_slab / courtyard_open / uniform_cohort) ----

danwei_planned:
  label: 单位规划主导
  desc: 工人新村典型:锁公共、均质板楼(18m±2)、释出大院、高度趋同。state 不动。
  fingerprint: 均质大院(高度CV 低、覆盖适中、内院开放)
  steps:
    - {op: freeze, who: [state]}
    - {op: uniform_cohort, target: [resident], band_m: 18, spread: 2}
    - {op: courtyard_open, target: [resident, developer], ratio: 0.75, cap_m: 36}
    - {op: level, target: [resident, developer], toward: median, alpha: 0.8}

incremental_extension:
  label: 渐进加建
  desc: 居民沿长轴接建板楼、适度细分自建单元。state 公共不动。
  fingerprint: 沿街拉长(瘦长比略升、栋数增加)
  steps:
    - {op: freeze, who: [state]}
    - {op: linear_slab, target: [resident], stretch: 1.25, cap_m: 42}
    - {op: infill, target: [resident], cell_m2: 90, min_h: 5, max_h: 18, vary: 0.3}
    - {op: level, target: [resident], toward: p40, alpha: 0.5}

old_block_renewal:
  label: 老旧小区更新
  desc: 塔化变细+沿街拉长+适度加密——开发商主导改造工人新村板楼。
  fingerprint: 板楼塔化(瘦长比升高、高度略增)
  steps:
    - {op: freeze, who: [state]}
    - {op: slim, target: [resident, developer], ratio: 0.55}
    - {op: linear_slab, target: [resident], stretch: 1.15, cap_m: 48}
    - {op: densify, target: [resident, developer], far_gain: 1.35, cap_m: 42}

# ---- 打浦桥 / 田子坊:24小时协商弄堂情境 ----

tourism_capture:
  label: 旅游流量资本主导
  desc: 文旅运营、平台商业与房东以游客容量、消费效率和商业可见性为优先。外围可更新商业建筑获得有限重组与增量开发权;居民住宅和公共设施保持稳定。
  fingerprint: 商业界面强化、游客主线集中、外围开发强度上升、边缘支弄与日常空间被弱化。
  steps:
    - {op: freeze, who: [state, resident]}
    - {op: split_to_towers, target: [developer], above_m2: 1200, k: 2}
    - {op: slim, target: [developer], ratio: 0.82}
    - {op: densify, target: [developer], far_gain: 1.10, cap_m: 36}

everyday_life_first:
  label: 居民安全与日常生活优先
  desc: 居民的回家权、安静权、消防安全与日常服务优先于过度商业扩张。居民住宅和公共设施冻结,由外围可更新商业空间适度让出地面以改善通行、疏散和社区服务。
  fingerprint: 高度变化温和、居民生活核心稳定、公共通行空间增加、商业扩张受控。
  steps:
    - {op: freeze, who: [state, resident]}
    - {op: open_ground, target: [developer], ratio: 0.88, cap_m: 24}
    - {op: level, target: [developer], toward: median, alpha: 0.45}

heritage_micro_economy:
  label: 遗产与小商户共生
  desc: 历史建筑、居民生活核心、小商户与创意工作室获得优先权。限制大尺度商业整合,将可更新商业体量细分为低成本经营、居民服务和文化展示单元。
  fingerprint: 细粒度经营单元增加、中低层尺度、商业体量分散、历史里弄保持生活性与文化生产能力。
  steps:
    - {op: freeze_tags, tags: [heritage, residential_core, emergency_access]}
    - {op: micro_lease, target: [developer], above_m2: 500, cell_m2: 80, affordable_ratio: 0.35, local_service_ratio: 0.20, culture_ratio: 0.15, min_h: 6, max_h: 18, seed: 42}
    - {op: frontage_quota, primary_routes: tourist_spine, frontage_buffer_m: 8, max_tourism_ratio: 0.45, min_local_service_ratio: 0.15, min_micro_shop_ratio: 0.25, min_culture_ratio: 0.15, seed: 42}

negotiated_24h_alley:
  label: 24小时协商弄堂
  desc: 不同主体不永久占有弄堂,而是在不同时间与客流状态下获得不同优先权。白天支持游客、小商户与文化活动;高峰期优先消防与疏散;夜间将部分消费空间和支弄归还给居民、维护与安静生活。
  fingerprint: 历史与居民核心受保护、细粒度经营共存、游客流线可调节、夜间空间归还、公共安全与文化活力并行。
  steps:
    - {op: freeze_tags, tags: [heritage, residential_core, emergency_access]}
    - {op: micro_lease, target: [developer], above_m2: 500, cell_m2: 80, affordable_ratio: 0.35, local_service_ratio: 0.20, culture_ratio: 0.15, min_h: 6, max_h: 18, seed: 42}
    - {op: frontage_quota, primary_routes: tourist_spine, frontage_buffer_m: 8, max_tourism_ratio: 0.45, min_local_service_ratio: 0.15, min_micro_shop_ratio: 0.25, min_culture_ratio: 0.15, seed: 42}
    - {op: crowd_valve, route: tourist_spine, crowd_threshold: 0.75, one_way_links: true, protect_tags: [resident_gate, emergency_access], relief_nodes: 3}
    - {op: night_reversion, start_hour: 22, quiet_buffer_m: 10, commercial_shutdown_ratio: 0.60, protect_tags: [residential_core, resident_gate]}
